<body>

<button class="c" id="run" aria-label="Бег"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="8" r="4" fill="#fff"/><path d="M27 16l-5 10 8 6 2 10M22 26l-6 4-4 8M27 16l7 5 5-3M27 16l-6 3-4 6"/></svg></button>

<script>
const T=40;
let W=38,H=23,G=[],LK=[],WP=[],WT={},WD={},BT=[],MP={},curMap=0;
const ADM={mon:true,dark:true,spd:1};
const ST={shake:true,blood:true,epi:false};
try{Object.assign(ST,JSON.parse(localStorage.getItem('sr_st')||'{}'))}catch(e){}
const saveST=()=>{try{localStorage.setItem('sr_st',JSON.stringify(ST))}catch(e){}};
const DIFFS=[
 {name:'Легкая',d:'Медленный монстр, он видит недалеко. Нужно найти 2 ключа, запертая дверь подсвечена, ключи лежат на одних и тех же местах.',pat:45,sea:55,chs:95,see:210,hear:150,roll:.2,hint:1,np:2,fixed:1,lockT:0},
 {name:'Средняя',d:'Обычный монстр. 3 ключа спрятаны в случайных партах: ключ открывает кабинет, а в нём лежит следующий.',pat:65,sea:80,chs:135,see:320,hear:260,roll:.4,hint:0,np:3,fixed:0,lockT:0},
 {name:'Сложная',d:'Быстрый монстр с большим обзором. В шкафчике можно сидеть лишь несколько секунд (идёт таймер). 4 ключа в случайных партах, дверь за дверью.',pat:80,sea:105,chs:160,see:420,hear:340,roll:.55,hint:0,np:4,fixed:0,lockT:7}
];
let selMap=0,selDiff=1,speed=false,DF=DIFFS[1],hideT=0,hideCd=0,gymT=0;
const fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0');

const mk=()=>{G=[];for(let y=0;y<H;y++)G.push(new Array(W).fill(1));WD={};BT=[]};
const car=(x,y,a,b)=>{for(let j=y;j<y+b;j++)for(let i=x;i<x+a;i++)G[j][i]=0};
const lockers=l=>{LK=l.map(([i,j])=>({i,j,x:(i+.5)*T,y:(j+.5)*T}))};
const cdec=l=>l.forEach(([i,j,k])=>{WD[i+','+j]=k});
function roomDec(x,r,inner){
 WD[x+','+r]=inner?'std':'win';WD[(x+1)+','+r]='ptr';
 for(let k=2;k<6;k++)WD[(x+k)+','+r]='b'+(k-2);
 WD[(x+6)+','+r]='map';WD[(x+7)+','+r]=inner?'std':'win';
}

/* КАРТЫ: 0 — обычная, 1 — спортзал */
const MAPS=[
{n:'Обычная',build(){
 W=38;H=23;mk();car(1,10,35,3);const rm=[];
 const bt={1:'Классная работа',10:'Не оборачивайся',19:'Дежурный — ТЫ',28:'Он смотрит'};
 for(const x of[1,10,19,28]){
  car(x,2,8,6);car(x+3,8,2,2);car(x,15,8,6);car(x+3,13,2,2);
  const kd={1:[4,8],10:[7,4],19:[4,7],28:[8,4]}[x];
  for(const dx of[1,2,5,6]){for(const dy of[3,5])G[dy][x+dx]=kd[0];for(const dy of[17,19])G[dy][x+dx]=kd[1]}
  rm.push({r:[x,2,8,6],d:[[x+3,8],[x+4,8]]},{r:[x,15,8,6],d:[[x+3,14],[x+4,14]]});
  roomDec(x,1);roomDec(x,21);BT.push([x+2,1,bt[x]],[x+2,21,bt[x]]);
 }
 G[11][36]=2;
 lockers([7,16,25,34].flatMap(i=>[[i,9],[i,13]]));
 WP=[[3,11],[14,11],[25,11],[33,11],[4,4],[13,4],[22,4],[31,4],[4,18],[13,18],[22,18],[31,18]];
 WT={'10,9':'ОН СЛЫШИТ','19,9':'ПРЯЧЬСЯ','28,9':'НЕ БЕГИ','1,13':'ОН ТУТ'};
 cdec([[2,9,'gas'],[8,9,'std'],[12,9,'clk'],[17,9,'flg'],[21,9,'std'],[26,9,'soap'],[30,9,'ptr'],[35,9,'gas'],
  [3,13,'flg'],[9,13,'std'],[12,13,'soap'],[18,13,'clk'],[21,13,'ptr'],[27,13,'std'],[30,13,'flg'],[35,13,'soap']]);
 MP={s:[2,11],e:[36,11],m:[35,18],rooms:rm,room:(i,j)=>(j<10||j>12)&&!(i>=28&&i<36&&j<8)&&!(i<9&&j>14)};
}},
{n:'Спортзал',build(){
 W=38;H=23;mk();car(2,2,34,19);const rm=[];
 for(const i of[13,22])for(const j of[6,14]){G[j][i]=G[j][i+1]=G[j+1][i]=G[j+1][i+1]=1}
 [[16,9],[17,9],[19,12],[20,12],[12,10],[24,10],[10,12],[26,12],[16,17],[17,17],[6,11],[30,11]].forEach(([i,j])=>{G[j][i]=5});
 for(const[x,y,dy]of[[4,3,7],[28,3,7],[4,16,15],[28,16,15]]){
  for(let j=y-1;j<=y+4;j++)for(let i=x-1;i<=x+5;i++)G[j][i]=1;
  car(x,y,5,4);G[dy][x+2]=G[dy][x+3]=0;
  G[y][x]=G[y][x+4]=G[y+3][x]=G[y+3][x+4]=5;
  rm.push({r:[x,y,5,4],d:[[x+2,dy],[x+3,dy]]});
 }
 G[11][36]=2;
 lockers([12,16,20,24].flatMap(i=>[[i,1],[i,21]]));
 WP=[[3,3],[12,4],[18,4],[24,4],[35,4],[3,11],[11,11],[19,10],[29,11],[35,11],[3,19],[12,18],[18,19],[24,18],[35,19]];
 WT={'4,7':'ОН СЛЫШИТ','28,7':'НЕ БЕГИ','4,15':'ОН ТУТ','28,15':'ПРЯЧЬСЯ'};
 cdec([[11,1,'win'],[14,1,'flg'],[18,1,'win'],[22,1,'flg'],[26,1,'win'],[34,1,'win'],[2,1,'win'],
  [11,21,'win'],[14,21,'std'],[18,21,'clk'],[22,21,'std'],[26,21,'win'],[34,21,'win'],[2,21,'win']]);
 MP={s:[3,11],e:[36,11],m:[25,18],rooms:rm,room:(i,j)=>j<9||j>13};
}}
];
function loadMap(n){MAPS[n].build()}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const lcv=document.createElement('canvas');
const lc=lcv.getContext('2d');

const scr=document.getElementById('scr');
const rb=document.getElementById('run');
const hb=document.getElementById('hide');

let w,h,Z,P,M,KY,kc=0,state='menu',time=0,t0=0,sc0=0;
let msg='',msgT=0,run=false,bo=0,nbo=15,hbT=0,creak=8;

const K=new Set();

let joy={
 on:false,x:0,y:0,ox:0,oy:0,id:-1
};

function rs(){
 w=cv.width=lcv.width=innerWidth;
 h=cv.height=lcv.height=innerHeight;
 Z=Math.max(.8,Math.min(1.6,Math.min(w,h)/460));
}

addEventListener('resize',rs);
rs();

const ti=v=>Math.floor(v/T);

function solid(x,y){
 const i=ti(x),j=ti(y);
 return i<0||j<0||i>=W||j>=H||G[j][i]!==0;
}

function bl(x,y,r){
 return solid(x-r,y-r)||solid(x+r,y-r)||
 solid(x-r,y+r)||solid(x+r,y+r);
}

function move(o,dx,dy,r){
 if(!bl(o.x+dx,o.y,r))o.x+=dx;
 if(!bl(o.x,o.y+dy,r))o.y+=dy;
}

function los(x1,y1,x2,y2){
 const d=Math.hypot(x2-x1,y2-y1);
 const n=Math.ceil(d/10);

 for(let i=1;i<n;i++){
  if(solid(
   x1+(x2-x1)*i/n,
   y1+(y2-y1)*i/n
  ))return false;
 }

 return true;
}

function path(sx,sy,tx,ty){
 const s=sy*W+sx;
 const e=ty*W+tx;

 const pr=new Int32Array(W*H).fill(-2);
 pr[s]=-1;

 const q=[s];

 for(let k=0;k<q.length;k++){
  const c=q[k];

  if(c===e)break;

  const cx=c%W;
  const cy=(c/W)|0;

  for(const[dx,dy]of[
   [1,0],[-1,0],[0,1],[0,-1]
  ]){
   const nx=cx+dx;
   const ny=cy+dy;

   if(nx<0||ny<0||nx>=W||ny>=H||G[ny][nx]!==0)continue;

   const n=ny*W+nx;

   if(pr[n]!==-2)continue;

   pr[n]=c;
   q.push(n);
  }
 }

 if(pr[e]===-2)return[];

 const p=[];

 for(let c=e;c!==s;c=pr[c]){
  p.push([
   (c%W+.5)*T,
   ((c/W|0)+.5)*T
  ]);
 }

 return p.reverse();
}

/* ЗВУК */

let AC,tg;

function osc(f,ty,d){
 const o=AC.createOscillator();
 o.type=ty;
 o.frequency.value=f;
 o.connect(d);
 o.start();
}

function initAudio(){
 if(AC)return;

 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
 }catch(e){
  return;
 }

 const m=AC.createGain();
 m.gain.value=.1;
 m.connect(AC.destination);

 osc(46,'sine',m);
 osc(48.5,'sine',m);

 tg=AC.createGain();
 tg.gain.value=0;
 tg.connect(AC.destination);

 osc(880,'sine',tg);
 osc(932,'sine',tg);
 osc(1245,'sine',tg);
}

function tone(ty,f1,f2,d,v,dl=0){
 if(!AC)return;

 const n=AC.currentTime+dl;
 const o=AC.createOscillator();
 const g=AC.createGain();

 o.type=ty;

 o.frequency.setValueAtTime(f1,n);
 o.frequency.exponentialRampToValueAtTime(f2,n+d);

 g.gain.setValueAtTime(v,n);
 g.gain.exponentialRampToValueAtTime(.001,n+d);

 o.connect(g).connect(AC.destination);
 o.start(n);
 o.stop(n+d+.05);
}

const thump=v=>{
 tone('sine',75,30,.14,v);
 tone('sine',60,28,.14,v*.8,.17);
};

const sfxAl=()=>tone('sawtooth',220,1400,.6,.12);

function scream(){
 if(!AC)return;

 const n=AC.currentTime;

 const b=AC.createBuffer(
  1,AC.sampleRate*1.6,AC.sampleRate
 );

 const d=b.getChannelData(0);

 for(let i=0;i<d.length;i++){
  d[i]=Math.random()*2-1;
 }

 const s=AC.createBufferSource();
 const g=AC.createGain();

 s.buffer=b;
 g.gain.setValueAtTime(.8,n);
 g.gain.exponentialRampToValueAtTime(.001,n+1.6);

 s.connect(g).connect(AC.destination);
 s.start(n);

 tone('sawtooth',950,250,1.5,.3);
 tone('square',1400,380,1.5,.15);
 tone('sawtooth',90,40,1.8,.4);
}

/* КЛЮЧИ И ДВЕРИ */

let openPz=null;function closePz(){}
let have={},CT={},DR=[];
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const isC=v=>v===4||v===5||v===7||v===8;

function plan(){
 const rnd=DF.fixed?mul(7):Math.random,n=DF.np;
 const sh=a=>a.map(v=>[rnd(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
 const inR=(i,j,r)=>i>=r[0]&&i<r[0]+r[2]&&j>=r[1]&&j<r[1]+r[3];
 const L=sh(MP.rooms).slice(0,n-1),all=[];
 for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(isC(G[j][i]))all.push([i,j]);
 CT={};DR=[];have={};KY=new Array(n).fill(0);kc=0;
 L.forEach((q,k)=>{DR.push({t:q.d,need:k+1,open:false});q.d.forEach(([i,j])=>{G[j][i]=6})});
 for(let k=1;k<=n;k++){
  const pool=all.filter(([i,j])=>k===1?!L.some(q=>inR(i,j,q.r)):inR(i,j,L[k-2].r)&&!CT[i+','+j]);
  const c=sh(pool)[0];
  CT[c[0]+','+c[1]]={key:k,done:false};
 }
}
function nearCont(){
 let b=null,bd=56;const pi=ti(P.x),pj=ti(P.y);
 for(let j=pj-2;j<=pj+2;j++)for(let i=pi-2;i<=pi+2;i++){
  if(j<0||i<0||j>=H||i>=W||!isC(G[j][i]))continue;
  const d=Math.hypot(P.x-(i+.5)*T,P.y-(j+.5)*T);
  if(d<bd){bd=d;b=[i,j]}
 }
 return b;
}
function nearDoor(){
 for(const d of DR)if(!d.open)for(const[i,j]of d.t)if(Math.hypot(P.x-(i+.5)*T,P.y-(j+.5)*T)<58)return d;
 return null;
}
function useNear(){
 const d=nearDoor();
 if(d){
  if(have[d.need]){d.open=true;d.t.forEach(([i,j])=>{G[j][i]=0});say('Дверь открыта',2);tone('sawtooth',150,80,.35,.1)}
  else say('Заперто. Нужен ключ №'+d.need,2.5);
  return true;
 }
 const b=nearCont();
 if(b){
  const k=b[0]+','+b[1];let c=CT[k];if(!c)c=CT[k]={key:0,done:false};
  if(c.done)say('Здесь уже искали',1.5);
  else{
   c.done=true;
   if(c.key){have[c.key]=1;kc++;say(c.key<KY.length?'Нашёл ключ №'+c.key+'!':'Нашёл ключ от выхода! Беги!',3);tone('sine',700,1400,.3,.12)}
   else say('Пусто…',1.5);
  }
  return true;
 }
 return false;
}
function nearInfo(){
 const d=nearDoor();if(d)return have[d.need]?'Открыть дверь — ДЕЙСТВИЕ':'Дверь заперта';
 const b=nearCont();if(b){const c=CT[b.join(',')];return c&&c.done?'':'Обыскать — ДЕЙСТВИЕ'}
 return '';
}

/* ИГРА *//* ИГРА */

function say(t,s){
 msg=t;
 msgT=s;
}

function reset(){
 loadMap(curMap);
 P={
  x:(MP.s[0]+.5)*T,y:(MP.s[1]+.5)*T,a:0,
  hid:false,run:false,st:1,tired:false
 };

 kc=0;

 plan();

 M={
  x:(MP.m[0]+.5)*T,y:(MP.m[1]+.5)*T,
  st:'patrol',p:[],lk:[0,0],
  lost:0,wait:0,rt:0,roll:null,pk:0
 };

 t0=time;hideT=hideCd=0;gymT=0;if(!ADM.mon)parkM();

function nearLk(){
 let b=null,bd=58;

 for(const l of LK){
  const d=Math.hypot(P.x-l.x,P.y-l.y);

  if(d<bd){
   bd=d;
   b=l;
  }
 }

 return b;
}

function toggleHide(){

function fol(sp,dt){
 if(!M.p.length)return true;

 const[tx,ty]=M.p[0];
 const dd=Math.hypot(tx-M.x,ty-M.y);
 const s=sp*dt;

 if(dd<=s){
  M.x=tx;
  M.y=ty;
  M.p.shift();
 }else{
  const a=Math.atan2(ty-M.y,tx-M.x);

  M.x+=Math.cos(a)*s;
  M.y+=Math.sin(a)*s;
 }

 return false;
}

function updM(dt){
 const d=Math.hypot(P.x-M.x,P.y-M.y);

 const see=!P.hid&&d<DF.see&&los(M.x,M.y,P.x,P.y);
 const hear=!P.hid&&P.run&&d<DF.hear;

 const tx=ti(M.x);
 const ty=ti(M.y);

 if(see||hear){
  if(M.st!=='chase'){sfxAl();if(see)ach('run')}

  M.st='chase';
  M.lost=0;
  M.lk=[P.x,P.y];
 }else if(M.st==='chase'){
  M.lost+=dt;

  if(M.lost>1.5){
   M.st='search';
   M.wait=0;

   M.p=path(
    tx,ty,
    ti(M.lk[0]),ti(M.lk[1])
   );
  }
 }

 M.rt-=dt;

 if(M.st==='chase'){
  if(see&&d<110){
   const a=Math.atan2(P.y-M.y,P.x-M.x);

   M.x+=Math.cos(a)*DF.chs*dt;
   M.y+=Math.sin(a)*DF.chs*dt;

   M.p=[];
  }else{
   if(M.rt<=0||!M.p.length){
    M.p=path(
     tx,ty,
     ti(M.lk[0]),ti(M.lk[1])
    );

    M.rt=.4;
   }

   fol(DF.chs,dt);
  }
 }else if(M.st==='search'){
  if(fol(DF.sea,dt)){
   M.wait+=dt;

   if(M.wait>2.5){
    M.st='patrol';
    M.p=[];
   }
  }
 }else{
  if(!M.p.length){
   let t=WP[Math.random()*WP.length|0];

   if(Math.random()<(openPz?.9:.45)){
    let bd=1e9;

    for(const q of WP){
     const dd=Math.hypot(
      q[0]-ti(P.x),
      q[1]-ti(P.y)
     );

     if(dd<bd){
      bd=dd;
      t=q;
     }
    }
   }

   M.p=path(tx,ty,t[0],t[1]);
  }

  fol(DF.pat,dt);
 }

 if(P.hid&&d<60){
  if(M.roll===null)M.roll=Math.random()<DF.roll;

  M.pk+=dt;

  if(M.roll===true&&M.pk>1.3)return caught();

  if(M.roll===false&&M.pk>2.2){
   M.st='patrol';
   M.p=[];
  }
 }else{
  M.pk=0;

  if(d>110)M.roll=null;
 }

 if(!P.hid&&d<30)caught();
}

function upd(dt){
 let mx=
  (K.has('d')||K.has('arrowright')?1:0)-
  (K.has('a')||K.has('arrowleft')?1:0);

 let my=
  (K.has('s')||K.has('arrowdown')?1:0)-
  (K.has('w')||K.has('arrowup')?1:0);

 if(joy.on){
  mx+=joy.x;
  my+=joy.y;
 }

 const l=Math.hypot(mx,my);

 if(l>1){
  mx/=l;
  my/=l;
 }

 P.run=false;

 if(openPz&&l>.5)closePz();

 if(!P.hid&&l>.15){
  let sp=100;

  if((run||K.has('shift'))&&!P.tired&&P.st>0){
   sp=165;
   P.run=true;
   P.st=Math.max(0,P.st-dt/3);
  }

  move(P,mx*sp*dt*ADM.spd,my*sp*dt*ADM.spd,11);
  P.a=Math.atan2(my,mx);
 }

 if(!P.run)P.st=Math.min(1,P.st+dt/5);

 if(P.st<=0)P.tired=true;
 if(P.st>.35)P.tired=false;

 const ex=(MP.e[0]+.5)*T;
 const ey=(MP.e[1]+.5)*T;
 const de=Math.hypot(P.x-ex,P.y-ey);

 if(de<60){
  if(kc>=KY.length){
   state='escape';esc0=time;winT=time-t0;escDoor=0;ctl(false);
   if(tg)tg.gain.value=0;
   return;
  }

  if(msgT<=0)say('Нужен ключ от выхода',2);
 }

 if(curMap===1){gymT+=dt;if(gymT>=10)ach('gym')}
 hideCd=Math.max(0,hideCd-dt);
 if(P.hid&&DF.lockT){hideT-=dt;if(hideT<=0){P.hid=false;hideCd=6;say('Время вышло! Шкафчик не выдержал',2.5);tone('sawtooth',300,110,.5,.12)}}

 nbo-=dt;

 if(nbo<=0&&!ST.epi){
  bo=.5;
  nbo=16+Math.random()*18;
 }

 bo-=dt;

 if(ADM.mon)updM(dt);

 if(state!=='play')return;

 const d=Math.hypot(P.x-M.x,P.y-M.y);

 hbT-=dt;

 if(hbT<=0&&d<900){
  thump(.5*(1-d/900)+.05);
  hbT=.3+Math.min(d,700)/700*.9;
 }

 creak-=dt;

 if(creak<=0){
  tone('sawtooth',260+Math.random()*100,120,.9,.03);
  creak=8+Math.random()*9;
 }

 if(d<280&&Math.random()<dt*.7)tone('sawtooth',80+Math.random()*30,36,.8,.1);

 if(tg){
  tg.gain.setTargetAtTime(
   M.st==='chase'?.03:0,
   AC.currentTime,.3
  );
 }

 msgT-=dt;
}

function drawEscape(t){
 const c=ctx;c.setTransform(1,0,0,1,0,0);
 const sk=ST.shake?1:.3,z=Math.min(t*8.5,57.4),fz=z%1,fi=Math.floor(z),dd=58-z,K=Math.min(w,h)*.9,cx=w/2,cy=h*.46+Math.sin(t*15)*h*.012*sk;
 c.fillStyle='#000';c.fillRect(0,0,w,h);
 c.save();c.translate(cx,h/2);c.rotate(Math.sin(t*7.5)*.012*sk);c.translate(-cx,-h/2);
 const X=(x,d)=>cx+x*K/d,Y=(y,d)=>cy-(y-1.6)*K/d;
 let nr=0,fr=0;
 const S=(a,b,e,f,col)=>{
  const m=Math.max(.12,1-(nr+fr)/2*.04);
  c.fillStyle='rgb('+(col[0]*m|0)+','+(col[1]*m|0)+','+(col[2]*m|0)+')';
  c.beginPath();c.moveTo(X(a,nr),Y(b,nr));c.lineTo(X(a,fr),Y(b,fr));c.lineTo(X(e,fr),Y(f,fr));c.lineTo(X(e,nr),Y(f,nr));c.fill();
 };
 for(let n=40;n>=0;n--){
  nr=Math.max(n-fz,.25);fr=Math.min(n+1-fz,dd);
  if(fr<=nr)continue;
  const id=fi+n;
  S(-1.6,0,1.6,0,id&1?[106,91,73]:[92,78,62]);
  S(-1.6,3.2,1.6,3.2,[180,179,148]);
  if(id%3===0)S(-.5,3.19,.5,3.19,[255,250,220]);
  for(const s of[-1,1]){
   S(s*1.6,0,s*1.6,1.3,[63,106,86]);
   S(s*1.6,1.3,s*1.6,3.2,[180,179,148]);
   if((id+(s>0?3:0))%6===0)S(s*1.6,0,s*1.6,2.3,[90,58,28]);
  }
 }
 if(dd>.5&&dd<45){
  const o=Math.max(0,Math.min(1,(9-dd)/6)),x0=X(-1.6,dd),x1=X(1.6,dd),y0=Y(3.2,dd),y1=Y(0,dd),dw=(x1-x0)/2,dy=Y(2.4,dd),lw=dw*.65*(1-o*.95);
  c.fillStyle='#b4b394';c.fillRect(x0,y0,x1-x0,y1-y0);
  c.fillStyle='rgb(235,245,255)';c.fillRect(x0+dw*.35,dy,dw*1.3,y1-dy);
  c.fillStyle='#5a3a1c';c.fillRect(x0+dw*.35,dy,lw,y1-dy);c.fillRect(x0+dw*1.65-lw,dy,lw,y1-dy);
  c.fillStyle='#3f7';c.fillRect(x0+dw*.7,Y(2.95,dd),dw*.6,(y1-y0)*.05);
 }
 c.restore();
 for(const s of[-1,1]){
  const sw=Math.sin(t*15+(s>0?Math.PI:0))*sk;
  c.fillStyle='#3a2a20';c.beginPath();c.ellipse(cx+s*w*.28+sw*8,h*.98+sw*10,w*.07,h*.13,s*.25,0,7);c.fill();
  c.fillStyle='#d8b88e';c.beginPath();c.arc(cx+s*w*.26+sw*8,h*.88+sw*10,w*.045,0,7);c.fill();
 }
 let g=c.createRadialGradient(cx,h/2,Math.min(w,h)*.3,cx,h/2,Math.max(w,h)*.75);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.8)');c.fillStyle=g;c.fillRect(0,0,w,h);
 const wa=Math.max(0,Math.min(1,(6.2-dd)/3.4));
 if(wa>0){c.fillStyle='rgba(255,255,255,'+wa*wa+')';c.fillRect(0,0,w,h)}
 const fb=Math.max(0,Math.min(1,(t-7)/.6));
 if(fb>0){c.fillStyle='rgba(0,0,0,'+fb+')';c.fillRect(0,0,w,h)}
}

function drawScare(t){

 const fl=!ST.epi&&t<.6&&((t*24|0)%2===1);

 ctx.fillStyle=fl?'#c00':'#0a0000';

 ctx.strokeStyle='#2a261e';
 ctx.lineWidth=.004;

 ctx.beginPath();
 ctx.moveTo(-.05,-.55);
 ctx.lineTo(-.09,-.4);
 ctx.lineTo(-.04,-.33);

 ctx.moveTo(.2,-.45);
 ctx.lineTo(.12,-.36);

 ctx.moveTo(-.3,.1);

  ctx.fill();

  ctx.arc(jx,jy,.011,0,7);
  ctx.fill();

  ctx.fillStyle='#6a0000';
  ctx.fillRect(-.012,.13,.024,.16+Math.min(t,1)*.12);

  ctx.restore();
 }

 ctx.fillStyle='#000';

 for(const e of[-1,1]){
  ctx.beginPath();

 }

 const mo=Math.min(1,t*3);
 const my=.27;

 const a=my-.02;
 const c1=my-mh;
 const c2=my+mh*1.6;

 for(let i=-9;i<=9;i++){

  ctx.beginPath();
  ctx.moveTo(x-.016,yt);
  ctx.lineTo(x+.016,yt);
  ctx.lineTo(x,yt+.05+.03*k);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x-.016,yb);

  ctx.fill();
 }

 ctx.strokeStyle='#050000';ctx.lineWidth=.006;ctx.beginPath();
 for(const e of[-1,1])for(let k=0;k<4;k++){ctx.moveTo(e*(.22+k*.022),a-.035);ctx.lineTo(e*(.22+k*.022),a+.045)}
 ctx.stroke();
 ctx.fillStyle='rgba(210,205,190,.55)';
 for(let k=-3;k<=3;k++)ctx.fillRect(k*.05,a+(c2-a)*.5,.004,.06+.1*Math.abs(Math.sin(t*5+k)));
 ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=.004;ctx.beginPath();
 for(let k=-8;k<=8;k++){ctx.moveTo(k*.04,-.56);ctx.quadraticCurveTo(k*.05+Math.sin(t*6+k)*.02,-.1,k*.045,.3+Math.abs(k)*.01)}
 ctx.stroke();

 ctx.setTransform(1,0,0,1,0,0);

 g=ctx.createRadialGradient(
  w/2,h/2,Math.min(w,h)*.2,
  w/2,h/2,Math.max(w,h)*.75
 );

 g.addColorStop(0,'rgba(0,0,0,0)');
 g.addColorStop(1,'rgba(0,0,0,.85)');

 ctx.fillStyle=g;
 ctx.fillRect(0,0,w,h);
}

 }
};

cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

rb.addEventListener('pointerdown',e=>{
 e.preventDefault();
 run=true;
});

['pointerup','pointerleave','pointercancel'].forEach(v=>{
 rb.addEventListener(v,()=>{run=false;});
});

hb.addEventListener('pointerdown',e=>{
 e.preventDefault();
 toggleHide();
});

document.addEventListener('contextmenu',e=>{
 e.preventDefault();
});

 gym:{n:'Упал отжался',d:'Поиграть на карте «Спортзал»',i:ico('#2a3a5a','<rect x="22" y="30" width="20" height="6" fill="#aaa"/><rect x="14" y="21" width="8" height="24" rx="2" fill="#ddd"/><rect x="42" y="21" width="8" height="24" rx="2" fill="#ddd"/><rect x="8" y="27" width="6" height="12" rx="2" fill="#999"/><rect x="50" y="27" width="6" height="12" rx="2" fill="#999"/>')}
};
let AU={};
try{AU=JSON.parse(localStorage.getItem('sr_ach')||'{}')}catch(e){}
const toast=document.getElementById('toast'),corner=document.getElementById('corner'),AQ=[];
let aBusy=false;

function ach(k){
 if(AU[k]||!ACH[k])return;
 AU[k]=1;
 try{localStorage.setItem('sr_ach',JSON.stringify(AU))}catch(e){}
 AQ.push(k);nextAch();
}
function nextAch(){
 if(aBusy||!AQ.length)return;
 aBusy=true;
 const a=ACH[AQ.shift()];
 toast.innerHTML=a.i+'<div><small>ДОСТИЖЕНИЕ ПОЛУЧЕНО</small><b>'+a.n+'</b>'+(a.d?'<span>'+a.d+'</span>':'')+'</div>';
 toast.className='show';
 tone('sine',660,990,.25,.08);tone('sine',880,1320,.4,.07,.12);
 setTimeout(()=>{toast.className='';setTimeout(()=>{aBusy=false;nextAch()},600)},4200);
}
document.getElementById('cA').onclick=()=>menu('ach');

/* АНИМАЦИЯ МЕНЮ И РАСПОЛОЖЕНИЕ КНОПОК */

function menuAnim(){
 const u=time*.22,dir=Math.cos(u)>0?1:-1;
 P.x=(MP.s[0]+4+(Math.sin(u)+1)*11)*T;P.y=(MP.s[1]+.5)*T;P.a=dir>0?0:Math.PI;P.hid=false;
 M.x=P.x-dir*(240+Math.sin(time*.8)*70);M.y=P.y+Math.sin(time*.5)*26;M.p=[0];M.st='patrol';
 bo=!ST.epi&&time%7<.14?.2:0;
}

let UI={run:[.84,.87],act:[.6,.87]},uiEdit=false;
try{Object.assign(UI,JSON.parse(localStorage.getItem('sr_ui')||'{}'))}catch(e){}
const saveUI=()=>{try{localStorage.setItem('sr_ui',JSON.stringify(UI))}catch(e){}};
function applyUI(){
 for(const[k,b]of[['run',rb],['act',hb]]){b.style.left=UI[k][0]*innerWidth+'px';b.style.top=UI[k][1]*innerHeight+'px'}
}
addEventListener('resize',applyUI);applyUI();
[[rb,'run'],[hb,'act']].forEach(([b,k])=>{
 let dg=0;
 b.addEventListener('pointerdown',e=>{if(!uiEdit)return;dg=1;b.setPointerCapture(e.pointerId);e.stopImmediatePropagation();e.preventDefault()},true);
 b.addEventListener('pointermove',e=>{
  if(!dg)return;
  UI[k]=[Math.max(.07,Math.min(.93,e.clientX/innerWidth)),Math.max(.1,Math.min(.93,e.clientY/innerHeight))];
  applyUI();
 });
 b.addEventListener('pointerup',()=>{if(dg){dg=0;saveUI()}});
});
const ubar=document.getElementById('uibar');
function uiStart(){uiEdit=true;scr.style.display='none';corner.style.display='none';ctl(true);ubar.style.display='block'}
function uiEnd(){uiEdit=false;ubar.style.display='none';ctl(false);menu('set')}
document.getElementById('uOk').onclick=uiEnd;
document.getElementById('uRs').onclick=()=>{UI={run:[.84,.87],act:[.6,.87]};applyUI();saveUI()};

/* МЕНЮ */

const VER='1.5';
const INFO='Версия '+VER+'\nАвтор и оригинальная идея: Диас (DiaCom).\nИдеи: Али, Исмаил.\n\nГлавный разраб конечно же Claude))\n(я исправляю код)\n\nСпасибо то что играете.\nфакю\n\nыыы';

function menu(p){
 const B=(a,t,c)=>'<button class="mb'+(c?' '+c:'')+'" data-a="'+a+'">'+t+'</button>';
 let h='';
 if(p==='main')h='<h1>ПОБЕГ ИЗ ШКОЛЫ</h1>'+B('map','ИГРАТЬ')+B('set','НАСТРОЙКИ')+B('info','ИНФО')+'<p class="hint">v'+VER+'</p>';
 else if(p==='map')h='<h2>Карта</h2>'+MAPS.map((m,i)=>'<button class="mb'+(i===selMap?' sel':'')+'" data-m="'+i+'">'+m.n+'</button>').join('')+B('diff','ДАЛЕЕ','go')+B('main','Назад','sm');
 else if(p==='diff')h='<h2>Сложность</h2>'+DIFFS.map((d,i)=>'<button class="mb'+(i===selDiff?' sel':'')+'" data-d="'+i+'">'+d.name+'</button>').join('')
  +'<p>'+DIFFS[selDiff].d+'</p><label class="ck"><input type="checkbox" id="spd"'+(speed?' checked':'')+'> Спидран мод (таймер)</label>'
  +B('start','НАЧАТЬ','go')+B('map','Назад','sm')
  +'<p class="hint">Двигайся пальцем (джойстик), кнопки: бег и действие (их можно переставить в настройках). На компьютере: WASD, Shift, E.</p>';
 else if(p==='set')h='<h2>Настройки</h2>'+[['shake','Тряска'],['blood','Кровь на карте'],['epi','Эпилепсия']].map(([k,t])=>'<button class="mb tg '+(ST[k]?'on':'off')+'" data-t="'+k+'">'+t+': '+(ST[k]?'ДА':'НЕТ')+'</button>').join('')
  +'<p class="hint">Эпилепсия: убирает вспышки, мигание света и помехи.</p>'+B('ui','Интерфейс (кнопки)')+B('main','Назад','sm');
 else if(p==='ach'){
  const ks=Object.keys(ACH);
  h='<h2>Достижения '+ks.filter(k=>AU[k]).length+' / '+ks.length+'</h2>'+ks.map(k=>'<div class="ac'+(AU[k]?'':' lk')+'">'+ACH[k].i+'<div><b>'+ACH[k].n+'</b>'+(ACH[k].d?'<span>'+ACH[k].d+'</span>':'')+'</div></div>').join('')+B('main','Назад','sm');
 }
 else h='<h2>Инфо</h2><div class="info">'+INFO+'</div>'+B('main','Назад','sm');
 scr.innerHTML=h;scr.style.display='flex';ctl(false);
 scr.className=p==='main'?'m0':'';
 document.body.classList.toggle('epi',ST.epi);
 corner.style.display=p==='main'?'flex':'none';
}

scr.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.a==='ui'){uiStart();return}
 if(d.a==='start'){start();return}
 if(d.r==='again'){start();return}
 if(d.a){
  if(d.a==='main'&&state!=='menu'&&state!=='play'){state='menu';reset()}
  menu(d.a);
 }
 else if(d.m!==undefined){selMap=+d.m;menu('map')}
 else if(d.d!==undefined){selDiff=+d.d;menu('diff')}
 else if(d.t){ST[d.t]=!ST[d.t];saveST();menu('set')}
});
scr.addEventListener('change',e=>{if(e.target.id==='spd')speed=e.target.checked});
menu('main');
setTimeout(()=>ach('hi'),700);

/* ГЛАВНЫЙ ЦИКЛ */

reset();

let last=performance.now();

function loop(n){
 const dt=Math.min(.05,(n-last)/1000);
 last=n;

 time+=dt;

 if(state==='play'){
  upd(dt);

  if(state==='play')drawWorld();
 }else if(state==='menu'){
  menuAnim();
  drawWorld();
 }else if(state==='escape'){
  const t=time-esc0;
  drawEscape(t);escSfx(t,dt);
  if(t>7.7)finishWin();
 }

 if(state==='scare'){
  const t=time-sc0;

  drawScare(t);

  if(t>2.2){
   state='dead';

   showScr(
    'ОНО ПОЙМАЛО ТЕБЯ',
    '<p>Ты не первый, кто остался в школе после звонка…</p>',
    'ЕЩЁ РАЗ'
   );
  }
 }

 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
